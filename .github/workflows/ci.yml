name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  local-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run local QA
        run: bash deploy/scripts/local-qa.sh --quick --clippy
